name: Terraform Azure DevSecOps CI/CD

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:

  # ============================================================
  # STAGE 1 - CI / DEVSECOPS SECURITY SCAN
  # ============================================================

  security_scan:
    name: "Stage 1: Security & Quality Scan"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/preprod

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../..

      - name: Terraform Init - Validation
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: environments/preprod
          framework: terraform
          soft_fail: true

      - name: Run Trivy Misconfiguration Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: environments/preprod
          exit-code: 0


  # ============================================================
  # STAGE 2 - TERRAFORM PLAN + APPLY
  # ============================================================

  terraform_deploy:
    name: "Stage 2: Terraform Plan & Apply"

    needs: security_scan

    runs-on: ubuntu-latest

    # GitHub Environment
    # Configure required reviewers under:
    # Settings -> Environments -> production
    environment: production

    # Apply only from main or manual execution
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: environments/preprod

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ========================================================
      # TERRAFORM SETUP
      # ========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false


      # ========================================================
      # AZURE LOGIN
      # ========================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }


      # ========================================================
      # VERIFY AZURE LOGIN
      # ========================================================

      - name: Verify Azure Login
        run: |
          echo "Azure Account:"
          az account show

          echo ""
          echo "Azure Subscription:"
          az account list --output table


      # ========================================================
      # TERRAFORM INIT
      # ========================================================

      - name: Terraform Init
        run: terraform init


      # ========================================================
      # IMPORT EXISTING RESOURCE GROUPS
      # ========================================================

      - name: Import Existing Resource Groups
        shell: bash
        run: |

          echo "=================================================="
          echo "RESOURCE GROUP 1"
          echo "=================================================="

          if terraform state show \
            'module.resource_group.azurerm_resource_group.resource_group["rg1"]' \
            >/dev/null 2>&1
          then
            echo "rg1 already exists in Terraform state."
          else
            echo "Importing rg1 -> rg-comp"

            terraform import \
              'module.resource_group.azurerm_resource_group.resource_group["rg1"]' \
              "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-comp"
          fi


          echo ""
          echo "=================================================="
          echo "RESOURCE GROUP 2"
          echo "=================================================="

          if terraform state show \
            'module.resource_group.azurerm_resource_group.resource_group["rg2"]' \
            >/dev/null 2>&1
          then
            echo "rg2 already exists in Terraform state."
          else
            echo "Importing rg2 -> rg-comp2"

            terraform import \
              'module.resource_group.azurerm_resource_group.resource_group["rg2"]' \
              "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-comp2"
          fi


      # ========================================================
      # IMPORT EXISTING KEY VAULT
      # ========================================================

      - name: Import Existing Key Vault
        shell: bash
        run: |

          echo "=================================================="
          echo "KEY VAULT"
          echo "=================================================="

          if terraform state show \
            'module.key_vault.azurerm_key_vault.kv["kv1"]' \
            >/dev/null 2>&1
          then
            echo "Key Vault already exists in Terraform state."
          else
            echo "Importing kv1 -> kv-comp-dev-123"

            terraform import \
              'module.key_vault.azurerm_key_vault.kv["kv1"]' \
              "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-comp/providers/Microsoft.KeyVault/vaults/kv-comp-dev-123"
          fi


      # ========================================================
      # IMPORT EXISTING PUBLIC IP - BASTION
      # ========================================================

      - name: Import Existing Bastion Public IP
        shell: bash
        run: |

          echo "=================================================="
          echo "BASTION PUBLIC IP"
          echo "=================================================="

          if terraform state show \
            'module.public_ip.azurerm_public_ip.pip["pip_bastion"]' \
            >/dev/null 2>&1
          then
            echo "Bastion Public IP already exists in Terraform state."
          else
            echo "Importing pip_bastion -> pip-bastion-dev"

            terraform import \
              'module.public_ip.azurerm_public_ip.pip["pip_bastion"]' \
              "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-comp/providers/Microsoft.Network/publicIPAddresses/pip-bastion-dev"
          fi


      # ========================================================
      # IMPORT EXISTING PUBLIC IP - APPLICATION GATEWAY
      # ========================================================

      - name: Import Existing Application Gateway Public IP
        shell: bash
        run: |

          echo "=================================================="
          echo "APPLICATION GATEWAY PUBLIC IP"
          echo "=================================================="

          if terraform state show \
            'module.public_ip.azurerm_public_ip.pip["pip_appgw"]' \
            >/dev/null 2>&1
          then
            echo "Application Gateway Public IP already exists in Terraform state."
          else
            echo "Importing pip_appgw -> pip-appgw-dev"

            terraform import \
              'module.public_ip.azurerm_public_ip.pip["pip_appgw"]' \
              "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-comp/providers/Microsoft.Network/publicIPAddresses/pip-appgw-dev"
          fi


      # ========================================================
      # IMPORT EXISTING VNET
      # ========================================================

      - name: Import Existing Virtual Network
        shell: bash
        run: |

          echo "=================================================="
          echo "VIRTUAL NETWORK"
          echo "=================================================="

          if terraform state show \
            'module.virtual_network.azurerm_virtual_network.vnets["vnet1"]' \
            >/dev/null 2>&1
          then
            echo "VNet already exists in Terraform state."
          else
            echo "Importing vnet1 -> vnet-comp-dev"

            terraform import \
              'module.virtual_network.azurerm_virtual_network.vnets["vnet1"]' \
              "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-comp/providers/Microsoft.Network/virtualNetworks/vnet-comp-dev"
          fi


      # ========================================================
      # SHOW CURRENT TERRAFORM STATE
      # ========================================================

      - name: Terraform State List
        run: |
          echo "=================================================="
          echo "CURRENT TERRAFORM STATE"
          echo "=================================================="

          terraform state list


      # ========================================================
      # TERRAFORM PLAN
      # ========================================================

      - name: Terraform Plan
        run: terraform plan


      # ========================================================
      # TERRAFORM APPLY
      # ========================================================

      - name: Terraform Apply
        run: terraform apply -auto-approve