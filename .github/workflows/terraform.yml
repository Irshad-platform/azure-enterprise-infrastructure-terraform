name: Terraform Azure DevSecOps CI/CD

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write


jobs:

  # ============================================================
  # TEMPORARY SELF-HOSTED RUNNER TEST
  #
  # Purpose:
  #   Verify that GitHub can successfully route a job
  #   to the organization-level self-hosted runner.
  #
  # After this test succeeds, this job can be removed.
  # ============================================================

  test_runner:
  name: "TEST - Self-Hosted Runner"

  runs-on:
    group: Default
    labels: self-hosted

  steps:
    - name: Test Self-Hosted Runner
      shell: powershell
      run: |
        Write-Host "SELF-HOSTED RUNNER WORKING"
        hostname
        whoami
        terraform version
        az version


  # ============================================================
  # STAGE 1 - SECURITY & QUALITY SCAN
  #
  # Runs on:
  #   - Feature branch push
  #   - Pull Request to main
  #   - main push
  # ============================================================

  security_scan:

    name: "Stage 1: Security & Quality Scan"

    needs: test_runner

    runs-on: self-hosted

    defaults:
      run:
        working-directory: environments/preprod
        shell: bash

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ========================================================
      # TERRAFORM SETUP
      # ========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false


      - name: Terraform Version
        run: terraform version


      # ========================================================
      # TERRAFORM FORMAT
      # ========================================================

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../..


      # ========================================================
      # TERRAFORM INIT VALIDATION
      # ========================================================

      - name: Terraform Init Validation
        run: terraform init -backend=false


      # ========================================================
      # TERRAFORM VALIDATE
      # ========================================================

      - name: Terraform Validate
        run: terraform validate


      # ========================================================
      # TFLINT
      # ========================================================

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0


      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error


      # ========================================================
      # CHECKOV
      # ========================================================

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: environments/preprod
          framework: terraform
          soft_fail: true


      # ========================================================
      # TRIVY
      # ========================================================

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: environments/preprod
          exit-code: 0


  # ============================================================
  # STAGE 2 - TERRAFORM PLAN
  #
  # Feature branch:
  #   Test Runner
  #       ↓
  #   Security Scan
  #       ↓
  #   Terraform Plan
  #
  # Main:
  #   Test Runner
  #       ↓
  #   Security Scan
  #       ↓
  #   Terraform Plan
  #       ↓
  #   Manual Approval
  #       ↓
  #   Terraform Apply
  # ============================================================

  terraform_plan:

    name: "Stage 2: Terraform Plan"

    needs: security_scan

    runs-on: self-hosted

    defaults:
      run:
        working-directory: environments/preprod
        shell: bash

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ========================================================
      # TERRAFORM SETUP
      # ========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false


      - name: Terraform Version
        run: terraform version


      # ========================================================
      # AZURE LOGIN
      # ========================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }


      # ========================================================
      # VERIFY AZURE
      # ========================================================

      - name: Verify Azure Login
        run: |
          az account show


      # ========================================================
      # TERRAFORM INIT
      # ========================================================

      - name: Terraform Init
        run: terraform init


      # ========================================================
      # TERRAFORM PLAN
      # ========================================================

      - name: Terraform Plan
        run: terraform plan


  # ============================================================
  # STAGE 3 - MANUAL APPROVAL
  #
  # ONLY MAIN
  #
  # GitHub Environment:
  #   production
  #
  # Required reviewers should be configured in:
  #
  # Repository
  #   → Settings
  #   → Environments
  #   → production
  #   → Required reviewers
  # ============================================================

  manual_approval:

    name: "Stage 3: Manual Approval"

    needs: terraform_plan

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: self-hosted

    environment:
      name: production

    steps:

      - name: Production Approval Gate
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host "PRODUCTION DEPLOYMENT APPROVED"
          Write-Host "=============================================="


  # ============================================================
  # STAGE 4 - TERRAFORM APPLY
  #
  # ONLY MAIN
  #
  # Flow:
  #
  # Stage 1 → PASS
  # Stage 2 → PASS
  # Stage 3 → APPROVED
  # Stage 4 → APPLY
  # ============================================================

  terraform_apply:

    name: "Stage 4: Terraform Apply"

    needs: manual_approval

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: self-hosted

    defaults:
      run:
        working-directory: environments/preprod
        shell: bash

    environment:
      name: production

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ========================================================
      # TERRAFORM SETUP
      # ========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false


      - name: Terraform Version
        run: terraform version


      # ========================================================
      # AZURE LOGIN
      # ========================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }


      # ========================================================
      # VERIFY AZURE
      # ========================================================

      - name: Verify Azure Login
        run: |
          az account show


      # ========================================================
      # TERRAFORM INIT
      # ========================================================

      - name: Terraform Init
        run: terraform init


      # ========================================================
      # TERRAFORM APPLY
      # ========================================================

      - name: Terraform Apply
        run: terraform apply -auto-approve