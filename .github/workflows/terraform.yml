          echo "=================================================="


          # ------------------------------------------------------
          # snet1 -> frontend-subnet-dev
          # ------------------------------------------------------

          echo ""
          echo "Checking snet1..."

          if terraform state show \
            'module.subnets.azurerm_subnet.subnets["snet1"]' \
            >/dev/null 2>&1
          then
            echo "snet1 already exists in Terraform state."
          else
            echo "Importing snet1 -> frontend-subnet-dev"

