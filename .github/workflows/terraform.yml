name: Terraform Azure DevSecOps CI/CD

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:

  # ============================================================
  # STAGE 1 - CI / DEVSECOPS SECURITY SCAN
  # ============================================================

  security_scan:
    name: "Stage 1: Security & Quality Scan"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/preprod

    steps:

      # ----------------------------------------------------------
      # Checkout Repository
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # ----------------------------------------------------------
      # Terraform Format Check
      # ----------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../..

      # ----------------------------------------------------------
      # Terraform Init - Validation Only
      # ----------------------------------------------------------

      - name: Terraform Init
        run: terraform init -backend=false

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate

      # ----------------------------------------------------------
      # TFLint
      # ----------------------------------------------------------

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

      # ----------------------------------------------------------
      # Checkov Security Scan
      # ----------------------------------------------------------

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: environments/preprod
          framework: terraform
          soft_fail: true

      # ----------------------------------------------------------
      # Trivy Misconfiguration Scan
      # ----------------------------------------------------------

      - name: Run Trivy Misconfiguration Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: environments/preprod
          exit-code: 0


  # ============================================================
  # STAGE 2 - TERRAFORM PLAN
  # ============================================================

  terraform_plan:
    name: "Stage 2: Terraform Plan"

    needs: security_scan

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/preprod

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:

      # ----------------------------------------------------------
      # Checkout Repository
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # ----------------------------------------------------------
      # Azure Login
      # ----------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      # ----------------------------------------------------------
      # Verify Azure Login
      # ----------------------------------------------------------

      - name: Verify Azure Login
        run: |
          az account show
          az account list --output table

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        run: terraform init

      # ==========================================================
      # IMPORTANT:
      # IMPORT EXISTING RESOURCE GROUPS BEFORE PLAN
      # ==========================================================

      - name: Import Existing Resource Groups
        shell: bash
        run: |

          echo "=============================================="
          echo "Checking Terraform State"
          echo "=============================================="

          # ------------------------------------------------------
          # RG1
          # Azure Resource Group: rg-comp
          # Terraform Key: rg1
          # ------------------------------------------------------

          echo ""
          echo "Checking rg1..."

          if terraform state show \
            'module.resource_group.azurerm_resource_group.resource_group["rg1"]' \
            >/dev/null 2>&1
          then

            echo "rg1 is already present in Terraform state."
            echo "Skipping import."

          else

            echo "rg1 is NOT present in Terraform state."
            echo "Importing Azure Resource Group: rg-comp"

            terraform import \
              'module.resource_group.azurerm_resource_group.resource_group["rg1"]' \
              "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-comp"

          fi


          # ------------------------------------------------------
          # RG2
          # Azure Resource Group: rg-comp2
          # Terraform Key: rg2
          # ------------------------------------------------------

          echo ""
          echo "Checking rg2..."

          if terraform state show \
            'module.resource_group.azurerm_resource_group.resource_group["rg2"]' \
            >/dev/null 2>&1
          then

            echo "rg2 is already present in Terraform state."
            echo "Skipping import."

          else

            echo "rg2 is NOT present in Terraform state."
            echo "Importing Azure Resource Group: rg-comp2"

            terraform import \
              'module.resource_group.azurerm_resource_group.resource_group["rg2"]' \
              "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-comp2"

          fi


          # ------------------------------------------------------
          # Display State
          # ------------------------------------------------------

          echo ""
          echo "=============================================="
          echo "Terraform State After Import"
          echo "=============================================="

          terraform state list

      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # ----------------------------------------------------------
      # Upload Plan Artifact
      # ----------------------------------------------------------

      - name: Save Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: environments/preprod/tfplan


  # ============================================================
  # STAGE 3 - PRODUCTION APPROVAL + APPLY
  # ============================================================

  terraform_apply:
    name: "Stage 3: Manual Approval & Apply"

    needs: terraform_plan

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment: production

    defaults:
      run:
        working-directory: environments/preprod

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:

      # ----------------------------------------------------------
      # Checkout Repository
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # ----------------------------------------------------------
      # Download EXACT Terraform Plan
      # ----------------------------------------------------------

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: environments/preprod

      # ----------------------------------------------------------
      # Azure Login
      # ----------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      # ----------------------------------------------------------
      # Verify Azure Login
      # ----------------------------------------------------------

      - name: Verify Azure Login
        run: |
          az account show
          az account list --output table

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        run: terraform init

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan