name: Terraform Azure DevSecOps CI/CD

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read
  pull-requests: write


# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # STAGE 1 - SECURITY & QUALITY SCAN
  # ==========================================================

  security_scan:

    name: "Stage 1: Security & Quality Scan"

    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        working-directory: environments/preprod
        shell: cmd


    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # ADD DEVOPS TOOLS TO PATH
      #
      # Tools installed on:
      # C:\DEVOPS\Tools
      #
      # checkov.exe
      # gitleaks.exe
      # infracost.exe
      # terrascan.exe
      # tflint.exe
      # tfsec.exe
      # trivy.exe
      # trufflehog.exe
      # ------------------------------------------------------

      - name: Add DevOps Tools to PATH
        run: |
          echo C:\DEVOPS\Tools>>%GITHUB_PATH%


      # ------------------------------------------------------
      # VERIFY RUNNER AND TOOLS
      # ------------------------------------------------------

      - name: Verify Runner and Security Tools
        run: |
          echo ==============================================
          echo SELF-HOSTED RUNNER
          echo ==============================================
          echo Runner Name: %RUNNER_NAME%
          echo Runner OS: %RUNNER_OS%
          echo Runner Architecture: %RUNNER_ARCH%
          echo ==============================================
          echo SECURITY TOOLS
          echo ==============================================

          where tflint
          where checkov
          where trivy

          echo ==============================================
          echo TFLINT VERSION
          echo ==============================================
          tflint --version

          echo ==============================================
          echo CHECKOV VERSION
          echo ==============================================
          checkov --version

          echo ==============================================
          echo TRIVY VERSION
          echo ==============================================
          trivy --version


      # ------------------------------------------------------
      # TERRAFORM SETUP
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false


      # ------------------------------------------------------
      # TERRAFORM VERSION
      # ------------------------------------------------------

      - name: Terraform Version
        run: terraform version


      # ------------------------------------------------------
      # TERRAFORM FORMAT
      # ------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../..


      # ------------------------------------------------------
      # TERRAFORM INIT VALIDATION
      # ------------------------------------------------------

      - name: Terraform Init Validation
        run: terraform init -backend=false


      # ------------------------------------------------------
      # TERRAFORM VALIDATE
      # ------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # ------------------------------------------------------
      # TFLINT
      # ------------------------------------------------------

      - name: TFLint Init
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init


      - name: Run TFLint
        run: |
          tflint --recursive --minimum-failure-severity=error


      # ------------------------------------------------------
      # CHECKOV
      #
      # Uses local:
      # C:\DEVOPS\Tools\checkov.exe
      # ------------------------------------------------------

      - name: Run Checkov
        run: |
          checkov -d . --framework terraform --soft-fail


      # ------------------------------------------------------
      # TRIVY
      #
      # Uses local:
      # C:\DEVOPS\Tools\trivy.exe
      # ------------------------------------------------------

      - name: Run Trivy
        run: |
          trivy config . --exit-code 0


  # ==========================================================
  # STAGE 2 - TERRAFORM PLAN
  # ==========================================================

  terraform_plan:

    name: "Stage 2: Terraform Plan"

    needs: security_scan

    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        working-directory: environments/preprod
        shell: cmd


    env:

      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}


    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # ADD DEVOPS TOOLS TO PATH
      # ------------------------------------------------------

      - name: Add DevOps Tools to PATH
        run: |
          echo C:\DEVOPS\Tools>>%GITHUB_PATH%


      # ------------------------------------------------------
      # TERRAFORM SETUP
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false


      # ------------------------------------------------------
      # TERRAFORM VERSION
      # ------------------------------------------------------

      - name: Terraform Version
        run: terraform version


      # ------------------------------------------------------
      # AZURE LOGIN
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }


      # ------------------------------------------------------
      # VERIFY AZURE LOGIN
      # ------------------------------------------------------

      - name: Verify Azure Login
        run: |
          az account show


      # ------------------------------------------------------
      # TERRAFORM INIT
      # ------------------------------------------------------

      - name: Terraform Init
        run: |
          terraform init


      # ------------------------------------------------------
      # TERRAFORM PLAN
      # ------------------------------------------------------

      - name: Terraform Plan
        run: |
          terraform plan


  # ==========================================================
  # STAGE 3 - MANUAL APPROVAL
  #
  # ONLY MAIN BRANCH
  #
  # Required reviewers:
  # Settings
  #   -> Environments
  #      -> production
  #         -> Required reviewers
  # ==========================================================

  manual_approval:

    name: "Stage 3: Manual Approval"

    needs: terraform_plan

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows, X64]

    environment:
      name: production


    steps:

      - name: Production Approval Gate
        shell: cmd
        run: |
          echo ==============================================
          echo PRODUCTION DEPLOYMENT APPROVED
          echo ==============================================


  # ==========================================================
  # STAGE 4 - TERRAFORM APPLY
  #
  # ONLY MAIN BRANCH
  #
  # FLOW:
  #
  # Stage 1 Security Scan
  #          ↓
  # Stage 2 Terraform Plan
  #          ↓
  # Stage 3 Manual Approval
  #          ↓
  # Stage 4 Terraform Apply
  # ==========================================================

  terraform_apply:

    name: "Stage 4: Terraform Apply"

    needs: manual_approval

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        working-directory: environments/preprod
        shell: cmd


    environment:
      name: production


    env:

      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}


    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # ADD DEVOPS TOOLS TO PATH
      # ------------------------------------------------------

      - name: Add DevOps Tools to PATH
        run: |
          echo C:\DEVOPS\Tools>>%GITHUB_PATH%


      # ------------------------------------------------------
      # TERRAFORM SETUP
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false


      # ------------------------------------------------------
      # TERRAFORM VERSION
      # ------------------------------------------------------

      - name: Terraform Version
        run: terraform version


      # ------------------------------------------------------
      # AZURE LOGIN
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }


      # ------------------------------------------------------
      # VERIFY AZURE LOGIN
      # ------------------------------------------------------

      - name: Verify Azure Login
        run: |
          az account show


      # ------------------------------------------------------
      # TERRAFORM INIT
      # ------------------------------------------------------

      - name: Terraform Init
        run: |
          terraform init


      # ------------------------------------------------------
      # TERRAFORM APPLY
      # ------------------------------------------------------

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve